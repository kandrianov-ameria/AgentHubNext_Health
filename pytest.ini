[pytest]
testpaths = tests
pythonpath = .
addopts = -ra --strict-markers -p no:cacheprovider --tb=short --continue-on-collection-errors
markers =
    config: checks over configuration only, no requests beyond fetching the remote configuration
    smoke: one cheap request per service; the default run
    live: real 3D / video generation - slow and billable, only with run_tests.bat --live
filterwarnings =
    ignore::DeprecationWarning
